min_version = "2026.9.0"

[tools]
# Keep in lockstep with tests/e2e/Dockerfile (RUSTUP_TOOLCHAIN).
rust = { version = "1.98.1", components = ["clippy", "rustfmt", "rust-analyzer"] }
python = { version = "3.14", postinstall = "python -m pip install --upgrade pycairo PyGObject" }
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:crate-ci/typos" = "1.50.1"
"github:watchexec/cargo-watch" = "8.5.3"

[env]
CARGO_TERM_COLOR = "always"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.compile]
description = "Type-check all targets"
run = "cargo check --all-targets --all-features --locked"

[tasks.clippy]
description = "Lint with Clippy"
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Run Rust tests without a desktop display"
run = "env -u DISPLAY -u WAYLAND_DISPLAY GDK_BACKEND=x11 cargo test --all-targets --all-features --locked"

[tasks.scripts]
description = "Run Python unit tests under scripts/"
run = "python3 -m unittest discover -s scripts -p 'test_*.py'"

[tasks.deny]
description = "Check advisories, licenses, bans, and sources"
run = "cargo deny check"

[tasks.typos]
description = "Check spelling"
run = "typos"

[tasks.e2e]
description = "End-to-end GUI suite (Docker)"
raw_args = true
run = "./scripts/e2e.sh -p no:cacheprovider --timeout=60 --durations=10"

[tasks.check]
description = "Local pre-push quality checks"
depends = ["fmt", "compile", "clippy", "test", "deny", "typos"]

[tasks.start-dev]
description = "Rebuild and restart as files change"
run = "./scripts/start-dev.sh"

[tasks.dev]
description = "Build and launch the main app once"
run = "cargo run"

[tasks.chooser-dev]
description = "Build and open an isolated file chooser"
run = "./scripts/chooser-dev.sh"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.install]
description = "Build and install Files from this checkout"
run = "./install.sh"

[tasks.uninstall]
description = "Remove the installed Files"
run = "./uninstall.sh"
